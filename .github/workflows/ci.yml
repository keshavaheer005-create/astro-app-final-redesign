name: CI

# Release gate: nothing merges/deploys without a clean type-check, the unit
# tests covering session + cache isolation, and lint.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned so CI stays reproducible even if a newer bun changes install
          # behaviour. Bump together with bun.lock.
          bun-version: 1.4.2

      - name: Install dependencies
        # Deliberately not --frozen-lockfile: bun.lock predates this CI runner's
        # bun version, and a frozen install would fail on metadata-only churn.
        run: bun install

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Type-check
        run: bun run typecheck

      - name: Unit tests (session + cache isolation)
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bunx next build
        env:
          # Build-time only: no database is contacted during `next build`.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          SESSION_SECRET: ci-build-secret-not-used-at-runtime-0123456789
          NODE_ENV: production
