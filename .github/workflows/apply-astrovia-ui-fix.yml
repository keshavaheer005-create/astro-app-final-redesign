name: Apply Astrovia UI fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-ui:
    if: github.actor == 'keshavaheer005-create'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply UI patch and commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              s = p.read_text()
              original = s
              for old, new in replacements:
                  if old not in s:
                      raise SystemExit(f'Expected UI pattern not found in {path}: {old[:100]!r}')
                  s = s.replace(old, new, 1)
              p.write_text(s)
              print(f'patched {path}: {len(original)} -> {len(s)} bytes')

          patch('src/components/astrovia/screens/acharya.tsx', [
              ('''        {!focusMode && visibleMessages.length > 0 && (\n          <button\n            type="button"\n            onClick={() => setFocusMode(true)}\n            aria-label={t('acharya.focusReader')}\n            title={t('acharya.focusReader')}\n            className="relative inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-white/60 bg-white/40 text-emerald-deep transition-colors duration-200 hover:bg-white/75 active:scale-95"\n          >\n            <Icon name="eye" size={18} />\n          </button>\n        )}\n''', ''),
              ('rounded-full border border-white/60 bg-white/45', 'rounded-full bg-white/45'),
              ('rounded-full border border-white/60 bg-white/40', 'rounded-full bg-white/40'),
              ('bg-gradient-to-br from-emerald/15 to-gold/15 border border-emerald/20', 'bg-gradient-to-br from-emerald/15 to-gold/15'),
              ('className="shrink-0 pt-1.5"', 'className="shrink-0 pt-3"'),
              ("'glass glass-tint-emerald mx-auto w-full max-w-3xl rounded-[26px] px-1.5 py-1.5',", "'glass glass-tint-emerald mx-auto w-full max-w-3xl rounded-[26px] border-0 px-1.5 py-1.5',"),
              ("'focus-within:border-emerald/50 focus-within:shadow-[0_14px_40px_rgba(62,142,110,0.18)]',", "'focus-within:border-0 focus-within:shadow-[0_14px_40px_rgba(62,142,110,0.18)]',"),
              ("initial={{ x: -320, opacity: 0.98 }}", "initial={{ x: '-100%', opacity: 0.98 }}"),
              ("exit={{ x: -320, opacity: 0.98 }}", "exit={{ x: '-100%', opacity: 0.98 }}"),
              ('className="fixed inset-y-0 left-0 z-[91] flex w-[min(88vw,360px)] flex-col border-r border-white/70 bg-[#fbf8f0] shadow-[18px_0_50px_rgba(36,31,27,0.18)]"', 'className="fixed inset-0 z-[91] flex w-full flex-col bg-[#fbf8f0] shadow-[0_18px_50px_rgba(36,31,27,0.14)]"'),
              ('<div className="relative flex items-center gap-3 border-b border-emerald/10 px-4 pb-4 pt-2">', '<div className="relative flex items-center gap-3 px-4 pb-4 pt-3">'),
              ('''            <div className="relative flex items-center gap-3 px-4 pb-4 pt-3">\n              <div className="flex h-10 w-10 items-center justify-center rounded-2xl bg-gradient-to-br from-emerald/15 to-gold/20 text-emerald-deep">''', '''            <div className="relative flex items-center gap-3 px-4 pb-4 pt-3">\n              <button\n                type="button"\n                onClick={() => setHistoryOpen(false)}\n                aria-label={t('common.back')}\n                className="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-white/65 text-emerald-deep transition-colors duration-150 hover:bg-white active:scale-95"\n              >\n                <Icon name="arrow-left" size={19} />\n              </button>\n              <div className="flex h-10 w-10 items-center justify-center rounded-2xl bg-gradient-to-br from-emerald/15 to-gold/20 text-emerald-deep">'''),
              ("'group flex w-full items-start gap-2.5 rounded-2xl border border-transparent px-3 py-3 text-left transition-colors duration-150 active:scale-[0.99] disabled:opacity-50',", "'group flex w-full items-start gap-2.5 rounded-2xl px-3 py-3 text-left transition-colors duration-150 active:scale-[0.99] disabled:opacity-50',"),
              ("? 'border-emerald/20 bg-emerald-soft/75'\n                            : 'hover:border-emerald/10 hover:bg-white/75',", "? 'bg-emerald-soft/75'\n                            : 'hover:bg-white/75',"),
              ('className="mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-[20px] border border-gold/20 bg-gradient-to-br from-white to-gold/10 text-gold"', 'className="mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-[20px] bg-gradient-to-br from-white to-gold/10 text-gold"'),
              ('className="mx-1 mt-1 flex min-h-11 w-[calc(100%-0.5rem)] items-center justify-center gap-2 rounded-xl border border-emerald/15 bg-white/65 px-3 text-t12 font-semibold text-emerald-deep transition-colors duration-150 hover:bg-white disabled:opacity-50"', 'className="mx-1 mt-1 flex min-h-11 w-[calc(100%-0.5rem)] items-center justify-center gap-2 rounded-xl bg-white/65 px-3 text-t12 font-semibold text-emerald-deep transition-colors duration-150 hover:bg-white disabled:opacity-50"'),
          ])

          patch('src/components/astrovia/screens/home.tsx', [
              ('className="p-4 sm:p-5 glass-tint-emerald relative overflow-hidden"', 'className="p-4 sm:p-5 glass-tint-emerald border-0 relative overflow-hidden"'),
              ('className="relative mt-3 border-t border-emerald/15 pt-3"', 'className="relative mt-3 pt-3"'),
              ('items-center justify-center rounded-2xl border border-emerald/20 bg-white/65', 'items-center justify-center rounded-2xl bg-white/65'),
          ])

          patch('src/components/astrovia/predictive-outlook-card.tsx', [
              ('rounded-2xl border border-violet/20 bg-white/70', 'rounded-2xl bg-white/70'),
              ("'tap-sm min-h-[82px] rounded-2xl border px-3 py-3 text-left transition-[background,border-color,transform] duration-200 active:scale-[.98]',", "'tap-sm min-h-[82px] rounded-2xl px-3 py-3 text-left transition-[background,transform] duration-200 active:scale-[.98]',"),
              ("active ? 'border-violet/40 bg-violet-soft/65 shadow-[inset_0_1px_0_rgba(255,255,255,.8)]' : 'border-gold/15 bg-white/50 hover:bg-white/75',", "active ? 'bg-violet-soft/65 shadow-[inset_0_1px_0_rgba(255,255,255,.8)]' : 'bg-white/50 hover:bg-white/75',"),
              ('rounded-2xl border border-violet/20 bg-white/65', 'rounded-2xl bg-white/65'),
              ('rounded-full border border-gold/20 bg-gold-faint', 'rounded-full bg-gold-faint'),
          ])

          patch('src/components/astrovia/saved-insights-card.tsx', [
              ('<GlassCard className="p-4 sm:p-5">', '<GlassCard className="p-4 sm:p-5 border-0">'),
              ("cn('rounded-2xl border px-3 py-3 transition-colors duration-150', expandedId === item.id ? 'border-emerald/30 bg-emerald-soft/45' : 'border-gold/15 bg-white/50')", "cn('rounded-2xl px-3 py-3 transition-colors duration-150', expandedId === item.id ? 'bg-emerald-soft/45' : 'bg-white/50')"),
              ('className="mt-3 border-t border-emerald/15 pt-3"', 'className="mt-3 pt-3"'),
          ])
          PY

          rm .github/workflows/apply-astrovia-ui-fix.yml
          git config user.name 'keshavaheer005-create'
          git config user.email 'keshavaheer.005@gmail.com'
          git add src/components/astrovia/screens/acharya.tsx src/components/astrovia/screens/home.tsx src/components/astrovia/predictive-outlook-card.tsx src/components/astrovia/saved-insights-card.tsx .github/workflows/apply-astrovia-ui-fix.yml
          git commit -m 'refine Astrovia chat and home UI'
          git push origin main
