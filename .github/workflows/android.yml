# Builds the Android app in the cloud (no Android Studio needed).
#
# Run it:  GitHub → Actions → "Build Android app" → Run workflow
# Result:  the "astrovia-debug-apk" artifact (a zip containing app-debug.apk) for testing on a phone.
# If the 4 signing secrets exist (see ANDROID-BUILD.md) it also produces a signed
# .aab for Google Play.
name: Build Android app

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: Live site the app opens
        required: true
        default: https://astrosage.onrender.com
  push:
    tags: ['android-v*']

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CAPACITOR_SERVER_URL: ${{ github.event.inputs.server_url || 'https://astrosage.onrender.com' }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The GitHub Ubuntu runner already ships the Android SDK (ANDROID_HOME),
      # so no extra SDK action is needed. Just accept licenses and make sure the
      # platform/build-tools this project compiles against are present.
      - name: Prepare Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install web dependencies
        run: npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund

      - name: Sync Capacitor (builds offline page, copies plugins into the Android project)
        run: node scripts/prepare-android.mjs && npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: astrovia-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ── Signed bundle for Google Play (only when the keystore secrets are set) ──
      - name: Build release bundle
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Sign release bundle
        if: env.HAS_KEYSTORE == 'true'
        id: sign
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload signed bundle
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: astrovia-release-aab
          path: ${{ steps.sign.outputs.signedReleaseFile }}
          if-no-files-found: error
