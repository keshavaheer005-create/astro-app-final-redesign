<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Astrovia</title>
<style>
  :root { color-scheme: light; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center; text-align: center;
    background: linear-gradient(180deg, #F3E6BE 0%, #FAF7F0 45%, #F6F2EA 100%);
    color: #2A2420; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top, 0) 24px env(safe-area-inset-bottom, 0);
  }
  main { max-width: 340px; }
  svg { width: 72px; height: 72px; margin-bottom: 18px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size: 24px; margin: 0 0 8px; color: #8A6418; }
  p { margin: 0 0 6px; line-height: 1.55; font-size: 15px; color: #5b5149; }
  .hi { font-size: 14px; color: #7a6f65; margin-bottom: 22px; }
  a.btn {
    display: inline-block; margin-top: 8px; padding: 12px 28px; border-radius: 999px;
    background: linear-gradient(135deg, #C9A227, #E8C568); color: #2A2420; font-weight: 600;
    text-decoration: none; font-size: 15px; box-shadow: 0 6px 18px rgba(201,162,39,.35);
  }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
    <defs><linearGradient id="g" x1="10" y1="8" x2="38" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C9A227"/><stop offset="1" stop-color="#E8C568"/></linearGradient></defs>
    <path d="M22.73,9.52 A15,15 0 1 0 38.38,26.37 A11.5,11.5 0 0 1 22.73,9.52 Z" fill="url(#g)"/>
    <g stroke="url(#g)" stroke-width="1.6" stroke-linecap="round">
      <path d="M23.5 2.5v4.5M23.5 42v4.5M1.5 24.5H6M41 24.5h4.5"/>
      <path d="M8.2 9.2l3.2 3.2M35.6 36.6l3.2 3.2M8.2 39.8l3.2-3.2M35.6 12.4l3.2-3.2"/>
    </g>
  </svg>
  <h1>Can't reach the stars</h1>
  <p>Astrovia needs an internet connection. Check your connection and try again.</p>
  <p class="hi">इंटरनेट कनेक्शन जाँचें और फिर कोशिश करें।</p>
  <a class="btn" href="https://astrosage.onrender.com">Try again · फिर कोशिश करें</a>
</main>
</body>
</html>
